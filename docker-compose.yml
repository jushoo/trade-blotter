# Trade Blotter — local development compose
#
# For now only the Postgres service is wired up. The `backend` and `frontend`
# services below are stubs and will be enabled once their Dockerfiles exist.

services:
  db:
    image: postgres:16-alpine
    container_name: trade-blotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blotter
      POSTGRES_PASSWORD: blotter
      POSTGRES_DB: blotter
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blotter -d blotter"]
      interval: 5s
      timeout: 5s
      retries: 10

