# Trade Blotter — local development compose
#
# Postgres + backend services. The frontend service is a stub and will be
# enabled once its Dockerfile exists.

services:
  db:
    image: postgres:16-alpine
    container_name: trade-blotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blotter
      POSTGRES_PASSWORD: blotter
      POSTGRES_DB: blotter
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blotter -d blotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trade-blotter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blotter:blotter@db:5432/blotter?schema=public
      PORT: "4000"
      HOST: "0.0.0.0"
      CORS_ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: "t4zi7CAXkuoswiY/qS6wbga4dcw/1yV8AlwpnxUzyC8="
      BETTER_AUTH_URL: http://localhost:4000
    ports:
      - "4000:4000"

  # frontend:
  #   build:
  #     context: .
  #     dockerfile: frontend/Dockerfile
  #   container_name: trade-blotter-frontend
  #   depends_on:
  #     - backend
  #   ports:
  #     - "5173:5173"
  #   command: pnpm --filter frontend run dev

volumes:
  postgres-data:
